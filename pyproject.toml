[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.7,<3",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.16.0",
    "langgraph>=1.2.12",
    "langsmith>=0.14.1",
    "pydantic>=2.13.5",
]


[tool.mypy]
strict = true
files = ["langchain", "tests"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
]

[tool.uv.workspace]
members = [
    "mcp/mcp",
    "ollama-finetune-demo",
]
